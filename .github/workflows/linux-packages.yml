name: Linux packages

# Builds and tests the packages of every format, all with the same test build id
# (ci<run number>), so one run gives one set of packages with one version.
# The run number counts per workflow file: renaming this file starts it again at 1.
on:
  push:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the tested packages as pre-release test-ci<run number> (needs the TEST_RELEASES variable)'
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  # The modules go into the debs and the rpms alike (the 1.8.0 release ships the same
  # files in both).
  build-ebpf:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq nodejs git wget xz-utils ca-certificates make gcc flex bison bc rsync python3 \
            libssl-dev clang llvm libelf-dev

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .ci-cache
          key: linux-6.0

      - name: Build eBPF modules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          utils/ci/build-ebpf.sh ebpf .ci-cache

      - uses: actions/upload-artifact@v4
        with:
          name: ebpf-modules
          path: ebpf/opensnitch*.o

  deb:
    needs: build-ebpf
    uses: ./.github/workflows/deb-packages.yml
    with:
      snapshot: ci${{ github.run_number }}

  rpm:
    needs: build-ebpf
    uses: ./.github/workflows/rpm-packages.yml
    with:
      snapshot: ci${{ github.run_number }}

  # Publishing is never automatic. It needs all of:
  # - the repository variable TEST_RELEASES set to true (Settings > Secrets and variables >
  #   Actions > Variables); without it this job never runs, whatever is ticked;
  # - a manual run with "publish" ticked;
  # - all tests passed;
  # - whatever protection the "test-release" environment has (Settings > Environments),
  #   e.g. required reviewers. Without any, the job starts right away.
  release:
    needs: [deb, rpm]
    if: vars.TEST_RELEASES == 'true' && github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    environment: test-release
    permissions:
      contents: write
    env:
      TAG: test-ci${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-deb'
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-rpm'
          path: dist
          merge-multiple: true

      # GitHub replaces ~ with . in uploaded file names; renaming first keeps the names in
      # SHA256SUMS and the notes the same as on the release page. apt and dnf read the
      # version from inside the package, not from its file name.
      - name: Write release notes
        run: |
          shopt -s nullglob
          for f in dist/*~*; do mv "$f" "${f//\~/.}"; done
          git fetch -q --no-tags https://github.com/evilsocket/opensnitch master
          (cd dist && sha256sum *.deb *.rpm > SHA256SUMS)
          utils/ci/test-release-notes.sh dist FETCH_HEAD > notes.md
          cat notes.md
          ls -l dist

      # Under act (local runs) everything up to here runs, but nothing is published.
      - name: Publish pre-release
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Test build $(dpkg-deb -f dist/opensnitch_*.deb Version)" \
            --notes-file notes.md
